name: infra-ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Validate configuration
        run: ./scripts/validate.sh
      - id: versions
        name: Calculate independent infra image versions
        run: |
          source scripts/lib.sh
          echo "gateway_version=$(component_revision . nginx)" >> "$GITHUB_OUTPUT"
          echo "swarm_check_version=$(component_revision . swarm-check scripts/swarm-check.sh)" >> "$GITHUB_OUTPUT"
      - name: Build gateway
        run: docker build --build-arg APP_VERSION="${{ steps.versions.outputs.gateway_version }}" -f nginx/Dockerfile -t overtone-gateway:"${{ steps.versions.outputs.gateway_version }}" .
      - name: Build swarm-check
        run: docker build --platform linux/amd64 --build-arg APP_VERSION="${{ steps.versions.outputs.swarm_check_version }}" -f swarm-check/Dockerfile -t overtone-swarm-check:"${{ steps.versions.outputs.swarm_check_version }}" .
      - name: Validate rendered Nginx config
        run: |
          mkdir -p local-certs
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -keyout local-certs/tls.key -out local-certs/tls.crt -subj /CN=localhost
          docker run --rm \
            -e PUBLIC_SERVER_NAME=localhost \
            -e ADMIN_SERVER_NAME=localhost \
            -e ADMIN_BASTION_CIDR=127.0.0.1/32 \
            -v "$PWD/local-certs/tls.crt:/run/secrets/tls_crt:ro" \
            -v "$PWD/local-certs/tls.key:/run/secrets/tls_key:ro" \
            overtone-gateway:"${{ steps.versions.outputs.gateway_version }}" nginx -t
