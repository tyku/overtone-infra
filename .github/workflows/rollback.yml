name: rollback

on:
  workflow_dispatch:
    inputs:
      component:
        description: Component to roll back
        type: choice
        options: [backend, frontend, gateway, all]
        required: true

permissions:
  contents: read

jobs:
  rollback:
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Install SSH identity
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
      - name: Roll back and smoke test
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          COMPONENT: ${{ inputs.component }}
        run: ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd /opt/overtone-infra && ./scripts/rollback.sh '$COMPONENT'"
