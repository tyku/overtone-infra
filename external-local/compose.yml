name: overtone-external-local

services:
  postgres:
    image: postgres:17.6-alpine3.22
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      MEDSCRIBE_DATABASE_USER: ${MEDSCRIBE_DATABASE_USER:?set MEDSCRIBE_DATABASE_USER}
      MEDSCRIBE_DATABASE_PASSWORD: ${MEDSCRIBE_DATABASE_PASSWORD:?set MEDSCRIBE_DATABASE_PASSWORD}
      MEDSCRIBE_DATABASE_NAME: ${MEDSCRIBE_DATABASE_NAME:?set MEDSCRIBE_DATABASE_NAME}
    ports:
      - "${EXTERNAL_BIND_ADDRESS:-0.0.0.0}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init-medscribe.sh:/docker-entrypoint-initdb.d/20-medscribe.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "${EXTERNAL_BIND_ADDRESS:-0.0.0.0}:${S3_PORT:-9000}:9000"
      - "${EXTERNAL_BIND_ADDRESS:-0.0.0.0}:${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    security_opt:
      - no-new-privileges:true

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    volumes:
      - ./minio/init.sh:/config/init.sh:ro
    entrypoint:
      - /bin/sh
      - -ec
      - /config/init.sh

  inference-mock:
    profiles: ["inference"]
    build:
      context: ${MEDICAL_SCRIBE_DIR:-../../medical-scribe}
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      MEDSCRIBE_EXECUTION_MODE: mock
      MEDSCRIBE_GRPC_HOST: 0.0.0.0
      MEDSCRIBE_GRPC_PORT: 50051
      MEDSCRIBE_DATABASE_URL: postgresql://${MEDSCRIBE_DATABASE_USER}:${MEDSCRIBE_DATABASE_PASSWORD}@postgres:5432/${MEDSCRIBE_DATABASE_NAME}
      MEDSCRIBE_S3_ENDPOINT: http://minio:9000
      MEDSCRIBE_S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
      MEDSCRIBE_S3_REGION: ${S3_REGION:-us-east-1}
      MEDSCRIBE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      MEDSCRIBE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
    ports:
      - "${EXTERNAL_BIND_ADDRESS:-0.0.0.0}:${INFERENCE_PORT:-50051}:50051"
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import socket; socket.create_connection((\"127.0.0.1\", 50051), 2).close()'"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME:-overtone_external_postgres_data_v1}
  minio_data:
    name: ${MINIO_VOLUME_NAME:-overtone_external_minio_data_v1}
