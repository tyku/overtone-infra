name: overtone-dind-lab

services:
  manager-1:
    image: overtone-dind-node:test
    build:
      context: ../..
      dockerfile: scripts/lab/dind.Dockerfile
    privileged: true
    hostname: manager-1
    command: ["--storage-driver=overlay2"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    ports:
      - "127.0.0.1:${LAB_HTTP_PORT:-18080}:80"
      - "127.0.0.1:${LAB_HTTPS_PORT:-18443}:443"
      - "127.0.0.1:${LAB_KUMA_PORT:-13001}:3001"
    volumes:
      - manager_docker:/var/lib/docker
    networks:
      lab:
        ipv4_address: 172.30.30.21
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker-1:
    image: overtone-dind-node:test
    build:
      context: ../..
      dockerfile: scripts/lab/dind.Dockerfile
    privileged: true
    hostname: worker-1
    command: ["--storage-driver=overlay2"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - worker1_docker:/var/lib/docker
    networks:
      lab:
        ipv4_address: 172.30.30.22
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 3s
      retries: 40

  worker-2:
    image: overtone-dind-node:test
    build:
      context: ../..
      dockerfile: scripts/lab/dind.Dockerfile
    privileged: true
    hostname: worker-2
    command: ["--storage-driver=overlay2"]
    environment:
      DOCKER_TLS_CERTDIR: ""
    volumes:
      - worker2_docker:/var/lib/docker
    networks:
      lab:
        ipv4_address: 172.30.30.23
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 3s
      timeout: 3s
      retries: 40

networks:
  lab:
    name: overtone-dind-lab
    ipam:
      config:
        - subnet: 172.30.30.0/24

volumes:
  manager_docker:
  worker1_docker:
  worker2_docker:
